<app-page-title></app-page-title>

<app-form [form]="form" (submit)="submit()">
    <app-textbox [icon]="faPerson" [form]="form" placeholder="sackboy123" ctrlName="username" label="Username" type="username"></app-textbox>
    <app-textbox [icon]="faEnvelope" [form]="form" placeholder="sackboy@lbp.me" ctrlName="emailAddress" label="Email Address" type="email"></app-textbox>
    <app-textbox [icon]="faKey" [form]="form" placeholder="•••••••••" ctrlName="password" label="Password" type="password"></app-textbox>

    <ng-container buttons>
        <app-button-submit-form [form]="form" action="Sign Up"></app-button-submit-form>
    </ng-container>
    <span>
        Already have an account?
        <a class="underline hover:no-underline" ng-reflect-router-link="/login" title="Sign in." href="/login">
            Sign in.
        </a>
    </span>
</app-form>
